[project]
name = "urdu-ocr"
version = "0.1.0"
description = "Offline Windows desktop app for literal OCR of scanned Urdu Nastaleeq PDFs"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
urdu-ocr = "app.simple_gui:main"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
